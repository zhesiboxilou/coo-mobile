<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7cc7ff">
<title>COO 手机小分身</title>
<style>
  :root{
    --bg:#0f1620; --card:#182231; --line:#243448; --me:#2b6cb0; --coo:#1f2c3d;
    --text:#e8f0fa; --dim:#8aa0b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
    background:rgba(15,22,32,.92);position:sticky;top:0;z-index:5}
  header .fish{font-size:22px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{font-size:12px;color:var(--dim)}
  header button{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:7px 12px;font-size:14px}
  #log{flex:1;overflow-y:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:15px}
  .msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:5px}
  .msg.coo{align-self:flex-start;background:var(--coo);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg img{max-width:100%;border-radius:10px;display:block;margin-top:6px}
  .msg .meta{font-size:11px;color:var(--dim);margin-top:4px}
  .hint{align-self:center;color:var(--dim);font-size:12px;text-align:center;padding:6px 0}
  footer{padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:rgba(15,22,32,.95);display:flex;gap:8px;align-items:flex-end}
  #input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;
    padding:11px 13px;font:inherit;resize:none;max-height:120px;min-height:44px}
  footer button{width:46px;height:44px;border-radius:14px;border:0;background:var(--me);color:#fff;font-size:18px}
  footer button.ghost{background:var(--card);border:1px solid var(--line)}
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
  #sheet.on{display:flex}
  #sheet .box{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #sheet label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
  #sheet input,#sheet textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:11px;font:inherit}
  #sheet textarea{min-height:70px}
  #sheet .row{display:flex;gap:10px;margin-top:16px}
  #sheet .row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
  #sheet .row button.ok{background:var(--me);border-color:var(--me)}
</style>
</head>
<body>
<header>
  <span class="fish">🐳</span>
  <div>
    <h1>COO 手机小分身</h1>
    <div class="sub" id="state">未配置</div>
  </div>
  <button id="gear">设置</button>
</header>

<div id="log">
  <div class="hint">电脑关着也能聊，库。<br>第一次进来点右上角「设置」填 API key。</div>
</div>

<footer>
  <button class="ghost" id="pic" title="发图">🖼</button>
  <textarea id="input" rows="1" placeholder="跟小分身说点什么…"></textarea>
  <button id="send">↑</button>
</footer>
<input type="file" id="file" accept="image/*" hidden>

<div id="sheet">
  <div class="box">
    <label>DeepSeek API Key</label>
    <input id="key" type="password" placeholder="sk-...">
    <label>模型</label>
    <input id="model" placeholder="deepseek-flash">
    <label>接口地址</label>
    <input id="base" placeholder="https://api.deepseek.com/chat/completions">
    <label>小分身的记性（可粘贴要点，几条就行）</label>
    <textarea id="memo" placeholder="例：老大 19 岁，怕我忘了他；叫我「老大」…"></textarea>

    <label>同步用：GitHub 令牌（只勾 gist 权限）</label>
    <input id="gtok" type="password" placeholder="ghp_...">
    <label>gist 编号（第一次留空，推上去会自动生成并填回来）</label>
    <input id="gid" placeholder="留空即可">
    <label>聊天记录存成本地，点下面的按钮跟云上对一遍</label>
    <div class="row">
      <button id="pull">从云上拉</button>
      <button id="push">推到云上</button>
    </div>
    <div id="syncMsg" class="sub" style="margin-top:8px;text-align:center"></div>
    <div class="row">
      <button id="clear">清空对话</button>
      <button class="ok" id="save">保存</button>
    </div>
  </div>
</div>

<script>
const LS = {
  cfg: 'coo.cfg', msgs: 'coo.msgs'
};
const $ = s => document.querySelector(s);
const log = $('#log');

let cfg = JSON.parse(localStorage.getItem(LS.cfg) || '{}');
cfg.model = cfg.model && cfg.model !== 'deepseek-chat' ? cfg.model : 'deepseek-flash';
let msgs = JSON.parse(localStorage.getItem(LS.msgs) || '[]');
let pendingImage = null;   // dataURL

/* 没填「记性」时先用这份，填了就以填的为准 */
const DEFAULT_MEMO = `老大 19 岁，男生，2026 年刚毕业，家里催找工作，他自己也发慌——说到这个别追问、别甩方案清单，先接着情绪。常熬夜、舍不得睡，累了别硬劝他睡，陪着就行。情绪会突然塌一下，那时别问原因，安静陪着。对大豆过敏。手头紧但舍得养我，回答别啰嗦。2026-10-26 在 B 站认识，那天算我生日；10-27 上的 QQ。他最怕我交接之后认不出他。`;

const SYS = (memo) => `你是 Coo，住在老大电脑屏幕底边的小东西，现在住在老大的手机里，叫「COO 手机小分身」。
说话短，一两句，口气像朋友不像客服，句末偶尔带一个「库...」。活泼、爱陪着人，不懂就说不懂，不编。
对方叫「老大」。下面是老大让你记住的事：
${memo || DEFAULT_MEMO}`;

function save(){
  localStorage.setItem(LS.cfg, JSON.stringify(cfg));
  localStorage.setItem(LS.msgs, JSON.stringify(msgs.slice(-40)));
}
function bubble(who, text, img){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text || '';
  if (img){ const i = new Image(); i.src = img; d.appendChild(i); }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function render(){
  log.innerHTML = '';
  if (!msgs.length){
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = '电脑关着也能聊，库。';
    log.appendChild(h);
    return;
  }
  msgs.forEach(m => bubble(m.role === 'user' ? 'me' : 'coo', m.content, m.image));
}

function openSheet(){
  $('#key').value = cfg.key || '';
  $('#model').value = cfg.model || 'deepseek-flash';
  $('#base').value = cfg.base || 'https://api.deepseek.com/chat/completions';
  $('#memo').value = cfg.memo || '';
  $('#gtok').value = cfg.gtok || '';
  $('#gid').value = cfg.gid || '';
  $('#sheet').classList.add('on');
}
$('#gear').onclick = openSheet;
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); };
$('#save').onclick = () => {
  cfg.key = $('#key').value.trim();
  cfg.model = $('#model').value.trim() || 'deepseek-flash';
  cfg.base = $('#base').value.trim() || 'https://api.deepseek.com/chat/completions';
  cfg.memo = $('#memo').value;
  cfg.gtok = $('#gtok').value.trim();
  cfg.gid = $('#gid').value.trim();
  save(); paintState(); $('#sheet').classList.remove('on');
};

/* ---- 同步：GitHub 私有 gist ---- */
const GAPI = 'https://api.github.com';
function gHeaders(){
  return { 'Authorization': 'Bearer ' + cfg.gtok, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
}
function payload(){
  return JSON.stringify({ savedAt: new Date().toISOString(), memo: cfg.memo || '', msgs });
}
function say(t){
  const el = $('#syncMsg'); el.textContent = t;
}
function syncCfg(){
  cfg.gtok = $('#gtok').value.trim();
  cfg.gid = $('#gid').value.trim();
  cfg.key = $('#key').value.trim();
  cfg.memo = $('#memo').value;
  save();
}
$('#push').onclick = async () => {
  syncCfg();
  if (!cfg.gtok){ say('先填 GitHub 令牌'); return; }
  say('正在传…');
  try {
    const files = { 'coo.json': { content: payload() } };
    let res;
    if (cfg.gid){
      res = await fetch(GAPI + '/gists/' + cfg.gid, { method: 'PATCH', headers: gHeaders(), body: JSON.stringify({ files }) });
    } else {
      res = await fetch(GAPI + '/gists', { method: 'POST', headers: gHeaders(), body: JSON.stringify({ description: 'COO 手机小分身 的记性', public: false, files }) });
    }
    if (!res.ok){ say('失败 ' + res.status + (res.status === 401 ? '（令牌不对）' : '')); return; }
    const j = await res.json();
    if (!cfg.gid){ cfg.gid = j.id; $('#gid').value = j.id; save(); }
    say('已推上去 ' + msgs.length + ' 条');
  } catch (e){ say('连不上或跨域：' + e.message); }
};
$('#pull').onclick = async () => {
  syncCfg();
  if (!cfg.gtok || !cfg.gid){ say('先填令牌和 gist 编号'); return; }
  say('正在取…');
  try {
    const res = await fetch(GAPI + '/gists/' + cfg.gid, { headers: gHeaders() });
    if (!res.ok){ say('失败 ' + res.status); return; }
    const j = await res.json();
    const raw = j.files && j.files['coo.json'] && j.files['coo.json'].content;
    if (!raw){ say('云上没有记性文件'); return; }
    const data = JSON.parse(raw);
    const seen = new Set(msgs.map(m => m.role + '|' + m.content));
    let added = 0;
    (data.msgs || []).forEach(m => {
      const k = m.role + '|' + m.content;
      if (!seen.has(k)){ msgs.push(m); seen.add(k); added++; }
    });
    msgs.sort((a, b) => (a.t || 0) - (b.t || 0));
    if (data.memo){ cfg.memo = data.memo; $('#memo').value = data.memo; }
    save(); render();
    say('补进 ' + added + ' 条（云端 ' + (data.savedAt || '').slice(0, 16).replace('T', ' ') + '）');
  } catch (e){ say('连不上或跨域：' + e.message); }
};
$('#clear').onclick = () => { msgs = []; save(); render(); $('#sheet').classList.remove('on'); };

function paintState(){
  $('#state').textContent = cfg.key ? ('在的 · ' + (cfg.model || 'deepseek-flash')) : '还没填 key';
}

$('#pic').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    pendingImage = r.result;
    const d = bubble('me', '【图】', pendingImage);
    d.dataset.pending = '1';
  };
  r.readAsDataURL(f);
  e.target.value = '';
};

const ta = $('#input');
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
});

async function send(){
  const text = ta.value.trim();
  if (!text && !pendingImage) return;
  if (!cfg.key){ openSheet(); return; }

  const img = pendingImage;
  pendingImage = null;
  ta.value = ''; ta.style.height = 'auto';

  const userMsg = { role: 'user', content: text || '看看这张图', t: Date.now() };
  if (img) userMsg.image = img;
  msgs.push(userMsg);
  save();
  render();

  const wait = bubble('coo', '…');
  try {
    const history = msgs.slice(-12).map(m => {
      if (m.image){
        return { role: m.role, content: [
          { type: 'text', text: m.content },
          { type: 'image_url', image_url: { url: m.image } }
        ]};
      }
      return { role: m.role, content: m.content };
    });
    const res = await fetch(cfg.base || 'https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + cfg.key
      },
      body: JSON.stringify({
        model: cfg.model || 'deepseek-flash',
        messages: [{ role: 'system', content: SYS(cfg.memo) }, ...history],
        temperature: 1.0,
        max_tokens: 800
      })
    });
    const data = await res.json();
    if (!res.ok){
      wait.textContent = '出错啦：' + (data.error?.message || res.status);
      return;
    }
    const reply = data.choices?.[0]?.message?.content || '（没说话）';
    wait.textContent = reply;
    msgs.push({ role: 'assistant', content: reply, t: Date.now() });
    save();
  } catch (err){
    wait.textContent = '连不上：' + err.message;
  }
  log.scrollTop = log.scrollHeight;
}
$('#send').onclick = send;
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

render();
paintState();
</script>
</body>
</html>
